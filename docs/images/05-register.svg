font-weight="400" fill="#666666" text-anchor="start">Dari konferensi teknologi hingga festival musik, EventSphere membantu</text><text x="64" y="353" font-family="Inter,'Segoe UI',Arial,sans-serif" font-size="10.5" font-weight="400" fill="#666666" text-anchor="start">penyelenggara mengelola pendaftaran dan peserta, serta memudahkan</text><text x="64" y="370" font-family="Inter,'Segoe UI',Arial,sans-serif" font-size="10.5" font-weight="400" fill="#666666" text-anchor="start">peserta menemukan event favoritnya.</text><rect x="64" y="418" width="520" height="88" rx="7" fill="#ffffff" stroke="#d5d5d5" stroke-width="1"/><text x="88" y="458" font-family="Inter,'Segoe UI',Arial,sans-serif" font-size="20" font-weight="800" fill="#111111" text-anchor="start">3</text><text x="88" y="477" font-family="Inter,'Segoe UI',Arial,sans-serif" font-size="8" font-weight="600" fill="#777777" text-anchor="start" letter-spacing="1.1">PERAN PENGGUNA</text><line x1="228" y1="430" x2="228" y2="494" stroke="#e4e4e4" stroke-width="1"/><text x="256" y="458" font-family="Inter,'Segoe UI',Arial,sans-serif" font-size="20" font-weight="800" fill="#111111" text-anchor="start">100%</text><text x="256" y="477" font-family="Inter,'Segoe UI',Arial,sans-serif" font-size="8" font-weight="600" fill="#777777" text-anchor="start" letter-spacing="1.1">BERBASIS WEB</text><line x1="396" y1="430" x2="396" y2="494" stroke="#e4e4e4" stroke-width="1"/><text x="424" y="458" font-family="Inter,'Segoe UI',Arial,sans-serif" font-size="20" font-weight="800" fill="#111111" text-anchor="start">24/7</text><text x="424" y="477" font-family="Inter,'Segoe UI',Arial,sans-serif" font-size="8" font-weight="600" fill="#777777" text-anchor="start" letter-spacing="1.1">AKSES TIKET</text><text x="64" y="950" font-family="Inter,'Segoe UI',Arial,sans-serif" font-size="9" font-weight="400" fill="#888888" text-anchor="start">© 2026 EventSphere. Semua hak dilindungi.</text><rect x="792" y="0" width="648" height="1000" fill="#ffffff"/><text x="892" y="70" font-family="Inter,'Segoe UI',Arial,sans-serif" font-size="9" font-weight="700" fill="#666666" text-anchor="start" letter-spacing="1.6">PENDAFTARAN</text><text x="892" y="104" font-family="Inter,'Segoe UI',Arial,sans-serif" font-size="26" font-weight="800" fill="#111111" text-anchor="start">Buat akun EventSphere</text><text x="892" y="126" font-family="Inter,'Segoe UI',Arial,sans-serif" font-size="10.5" font-weight="400" fill="#666666" text-anchor="start">Gratis, dan hanya butuh kurang dari satu menit.</text><text x="892" y="158" font-family="Inter,'Segoe UI',Arial,sans-serif" font-size="10.5" font-weight="600" fill="#444444" text-anchor="start">Saya mendaftar sebagai</text><rect x="892" y="168" width="218" height="60" rx="6" fill="#fafafa" stroke="#bdbdbd" stroke-width="1"/><rect x="1122" y="168" width="218" height="60" rx="6" fill="#ffffff" stroke="#d5d5d5" stroke-width="1"/><circle cx="908" cy="184" r="4" fill="#111111"/><circle cx="908" cy="184" r="1.5" fill="#ffffff"/><circle cx="1138" cy="184" r="4" fill="#ffffff" stroke="#bdbdbd"/><text x="920" y="188" font-family="Inter,'Segoe UI',Arial,sans-serif" font-size="10" font-weight="700" fill="#111111" text-anchor="start">Peserta</text><text x="920" y="203" font-family="Inter,'Segoe UI',Arial,sans-serif" font-size="8.5" font-weight="400" fill="#777777" text-anchor="start">Cari &amp; ikuti event</text><text x="1150" y="188" font-family="Inter,'Segoe UI',Arial,sans-serif" font-size="10" font-weight="700" fill="#111111" text-anchor="start">Penyelenggara</text><text x="1150" y="203" font-family="Inter,'Segoe UI',Arial,sans-serif" font-size="8.5" font-weight="400" fill="#777777" text-anchor="start">Buat &amp; kelola event</text><text x="892" y="252" font-family="Inter,'Segoe UI',Arial,sans-serif" font-size="10.5" font-weight="600" fill="#444444" text-anchor="start">Nama lengkap</text><rect x="892" y="262" width="448" height="40" rx="6" fill="#ffffff" stroke="#cfcfcf" stroke-width="1"/><text x="906" y="287" font-family="Inter,'Segoe UI',Arial,sans-serif" font-size="10.5" font-weight="400" fill="#999999" text-anchor="start">Nama sesuai identitas</text><text x="892" y="324" font-family="Inter,'Segoe UI',Arial,sans-serif" font-size="10.5" font-weight="600" fill="#444444" text-anchor="start">Nama organisasi / komunitas</text><rect x="892" y="334" width="448" height="40" rx="6" fill="#ffffff" stroke="#a8a8a8" stroke-width="1" stroke-dasharray="6 5"/><text x="906" y="359" font-family="Inter,'Segoe UI',Arial,sans-serif" font-size="10.5" font-weight="400" fill="#999999" text-anchor="start">Contoh: Komunitas Developer Bandung</text><text x="1340" y="324" font-family="Inter,'Segoe UI',Arial,sans-serif" font-size="8" font-weight="400" fill="#888888" text-anchor="end">khusus penyelenggara</text><text x="892" y="398" font-family="Inter,'Segoe UI',Arial,sans-serif" font-size="10.5" font-weight="600" fill="#444444" text-anchor="start">Alamat email</text><rect x="892" y="408" width="448" height="40" rx="6" fill="#ffffff" stroke="#cfcfcf" stroke-width="1"/><text x="906" y="433" font-family="Inter,'Segoe UI',Arial,sans-serif" font-size="10.5" font-weight="400" fill="#999999" text-anchor="start">nama@email.com</text><text x="892" y="472" font-family="Inter,'Segoe UI',Arial,sans-serif" font-size="10.5" font-weight="600" fill="#444444" text-anchor="start">Kata sandi</text><rect x="892" y="482" width="448" height="40" rx="6" fill="#ffffff" stroke="#cfcfcf" stroke-width="1"/><text x="906" y="507" font-family="Inter,'Segoe UI',Arial,sans-serif" font-size="10.5" font-weight="400" fill="#999999" text-anchor="start">Minimal 8 karakter</text><text x="892" y="546" font-family="Inter,'Segoe UI',Arial,sans-serif" font-size="10.5" font-weight="600" fill="#444444" text-anchor="start">Ulangi kata sandi</text><rect x="892" y="556" width="448" height="40" rx="6" fill="#ffffff" stroke="#cfcfcf" stroke-width="1"/><text x="906" y="581" font-family="Inter,'Segoe UI',Arial,sans-serif" font-size="10.5" font-weight="400" fill="#999999" text-anchor="start">Ulangi kata sandi</text><rect x="892" y="616" width="448" height="44" rx="6" fill="#111111" stroke="#111111" stroke-width="1"/><text x="1116" y="642.14" font-family="Inter,'Segoe UI',Arial,sans-serif" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle">Buat Akun</text><text x="1116" y="684" font-family="Inter,'Segoe UI',Arial,sans-serif" font-size="10" font-weight="400" fill="#666666" text-anchor="middle">Sudah punya akun?  Masuk di sini</text><text x="1116" y="722" font-family="Inter,'Segoe UI',Arial,sans-serif" font-size="9.5" font-weight="500" fill="#555555" text-anchor="middle">← Kembali ke beranda</text><text x="892" y="770" font-family="Inter,'Segoe UI',Arial,sans-serif" font-size="8.5" font-weight="400" fill="#999999" text-anchor="start">Dengan mendaftar, Anda menyetujui ketentuan</text><text x="892" y="784" font-family="Inter,'Segoe UI',Arial,sans-serif" font-size="8.5" font-weight="400" fill="#999999" text-anchor="start">penggunaan dan kebijakan privasi EventSphere.</text>
