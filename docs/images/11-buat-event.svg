="521" height="34" rx="5" fill="#ffffff" stroke="#cfcfcf" stroke-width="1"/><text x="869" y="858" font-family="Inter,'Segoe UI',Arial,sans-serif" font-size="10" font-weight="400" fill="#999999" text-anchor="start">0  — isi 0 untuk event gratis</text><text x="314" y="888" font-family="Inter,'Segoe UI',Arial,sans-serif" font-size="9.5" font-weight="600" fill="#444444" text-anchor="start">Poster event</text><rect x="314" y="896" width="1062" height="28" rx="4" fill="#fafafa" stroke="#d5d5d5" stroke-width="1"/><rect x="322" y="901" width="66" height="18" rx="3" fill="#efefef" stroke="#d5d5d5" stroke-width="1"/><text x="355" y="913.2" font-family="Inter,'Segoe UI',Arial,sans-serif" font-size="7.5" font-weight="600" fill="#333333" text-anchor="middle">Pilih file</text><text x="400" y="914" font-family="Inter,'Segoe UI',Arial,sans-serif" font-size="8" font-weight="400" fill="#888888" text-anchor="start">JPG, PNG, WebP — maks. 4 MB, rasio ideal 16:9</text><rect x="290" y="946" width="1110" height="44" rx="7" fill="#ffffff" stroke="#d5d5d5" stroke-width="1"/><text x="314" y="973" font-family="Inter,'Segoe UI',Arial,sans-serif" font-size="8.5" font-weight="400" fill="#888888" text-anchor="start">Event akan tersimpan sebagai draf kecuali status diubah.</text><text x="1234" y="971.42" font-family="Inter,'Segoe UI',Arial,sans-serif" font-size="9.5" font-weight="600" fill="#333333" text-anchor="middle">Batal</text><rect x="1290" y="953" width="96" height="30" rx="6" fill="#111111" stroke="#111111" stroke-width="1"/><text x="1338" y="971.24" font-family="Inter,'Segoe UI',Arial,sans-serif" font-size="9" font-weight="700" fill="#ffffff" text-anchor="middle">Simpan Event</text>
